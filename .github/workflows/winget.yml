name: Winget

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to submit, e.g. v0.1.3
        required: true

jobs:
  update:
    runs-on: windows-latest
    steps:
      - name: Submit to winget-pkgs
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG/SwitchToKVM-$version-setup.exe"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe update SwitchToKVM.SwitchToKVM --version $version --urls $url --token $env:WINGET_TOKEN --submit
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate failed" }
